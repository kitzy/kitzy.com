<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <link rel="canonical" href="{{ page.redirect_url }}">
    <meta name="robots" content="noindex">
    <script>
        (function () {
            // Preserve incoming query string (e.g. LinkedIn/UTM tracking params) and hash.
            var target = new URL({{ page.redirect_url | jsonify }}, window.location.href);
            new URLSearchParams(window.location.search).forEach(function (value, key) {
                if (!target.searchParams.has(key)) target.searchParams.append(key, value);
            });
            if (window.location.hash && !target.hash) target.hash = window.location.hash;
            window.location.replace(target.toString());
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url={{ page.redirect_url }}"></noscript>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, <a href="{{ page.redirect_url }}">click here</a>.</p>
</body>
</html>
