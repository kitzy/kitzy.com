# Site settings
title: "Kitzy"
description: "Always automating, always iterating, always helping others."
baseurl: ""
url: "https://kitzy.com"
author: "Kitzy"
author_url: "https://kitzy.com/readme/"
author_image: "https://github.com/kitzy.png"
author_profiles:
  - "https://github.com/kitzy"
  - "https://linkedin.com/in/kitzy"
  - "https://bsky.app/profile/kitzy.com"
  - "https://hachyderm.io/@kitzy"
timezone: America/New_York

# GitHub settings
github_username: kitzy
repository: kitzy/kitzy.com

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed

# GitHub Pages specific settings (for Actions deployment)
# github: [metadata]  # Commented out for custom Actions deployment

# Permalink settings
permalink: /:categories/:title/

# Blog settings
blog_path: blog

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/
  pages:
    output: true
    permalink: /:name/
  redirects:
    output: true

# Collections paths - all content is in the content/ directory
collections_dir: content

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include static content assets (Jekyll copies these to _site)
include:
  - content/assets

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Kitzy"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "redirects"
    values:
      layout: "redirect"

# Social media defaults
social:
  image: "https://github.com/kitzy.png"
  type: "website"

# Site themes
# styles.css (LCARS) always loads as the base. A theme with a `stylesheet`
# layers its overrides on top; `fonts` is an optional Google Fonts URL.
# The visitor's choice is stored in localStorage under "kitzy-theme".
themes:
  default: lcars
  options:
    - id: lcars
      name: "LCARS"
    - id: man
      name: "kitzy(1)"
      stylesheet: "/assets/css/themes/man.css"
      fonts: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"

# Site navigation
navigation:
  - title: "Blog"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "Talks"
    url: "/talks/"
  - title: "Podcasts"
    url: "/podcasts/"
  - title: "External Writing"
    url: "/external-writing/"
  - title: "README"
    url: "/readme/"